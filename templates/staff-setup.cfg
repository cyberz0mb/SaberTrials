// SABER TRIALS - STAFF SETUP TEMPLATE
// Copy this file to GameData/SaberTrials/staff-setup.cfg and edit that copy.
// Lines beginning with // are comments and do nothing.
// Replace the CAPITALIZED placeholders before removing // from a command.
// Enable ONE section per use, then enter: exec staff-setup.cfg
// Never put this file in server.cfg/autoexec.cfg: saved roles already persist.
// Re-running an old grant could restore someone you previously removed.
// This file accepts PUBLIC account IDs/server keys, never private keys/passwords.

// A. FIRST OWNER - GAME HOSTED ON YOUR OWN PC
// In the game's console, staff identity shows YOUR public account ID.
// staff serverkey shows YOUR hosted server's public key (a different code).
// Fill both lines below and remove their leading //, then run this file once.
// "Owner" is a friendly label; changing someone's player name grants no powers.
// staff owner add OWNER_PUBLIC_ACCOUNT_ID "Owner"
// staff trust SERVER_PUBLIC_KEY
// Wait for "Staff: authenticated." and "Owner" before using staff commands.
// After success, put // back on those two lines. Your appointment is saved.

// B. DEDICATED SERVER OWNER - NO PLAYER RUNNING INSIDE THE SERVER
// In the dedicated server console, use only the owner-add line from section A.
// The player runs the trust line in THEIR game, using the server's public key.
// The operator obtains the player's public account ID using a trusted exchange.
// This setup does not grant ownership on someone else's server.

// C. ADD OR CHANGE STAFF - ALREADY AUTHENTICATED OWNER/ADMIN OR SERVER CONSOLE
// Leave section A disabled. Fill and enable the desired line, then run this file.
// Owner can appoint Admins/Moderators. Admin can appoint Moderators only.
// Use the other person's PUBLIC account ID, not their display name or client #.
// staff add ADMIN_PUBLIC_ACCOUNT_ID admin "Admin label"
// staff add MODERATOR_PUBLIC_ACCOUNT_ID moderator "Moderator label"
// staff role EXISTING_PUBLIC_ACCOUNT_ID moderator
// The new staff member must trust this server once on their own client.

// D. REMOVE AN APPOINTMENT
// Removal immediately revokes that account's access, including future logins.
// Leave grant lines above disabled before enabling this line.
// staff remove PUBLIC_ACCOUNT_ID_TO_REMOVE
// In-game staff cannot change themselves, equal ranks or higher ranks.
// Additional Owners/recovery require the trusted server console.

// E. CHECK OR SIGN IN - TYPE THESE IN YOUR GAME CONSOLE WHEN NEEDED
// staff whoami     -> shows your current authenticated role
// staff list       -> lists staff accounts
// staff login      -> signs in again after a logout
// staff logout     -> signs out without deleting your permanent appointment

// F. OPTIONAL AIM KEYS - YOUR GAME CLIENT ONLY, AFTER STAFF LOGIN
// Commands have no staff prefix. Choose unused keys before enabling these lines.
// bind F6 "freeze"
// bind F7 "unfreeze"
// Close the console, aim at a visible player or bot, then press the key.
// With no player under your aim, nothing happens. Walls block aim selection.
// You can still type freeze #0 / unfreeze #0 for a known slot from status.

echo "Staff template read. Only uncommented commands run; use staff whoami to check your role."
