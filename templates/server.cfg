// SABER TRIALS - SERVER CONFIGURATION TEMPLATE
// Copy to GameData/SaberTrials/server.cfg. Edit values inside the quotes.
// Lines starting with // explain settings; they do not run.
// This file is self-contained: no other server preset is required.
// Running exec server.cfg applies these settings and loads the map at the end.
// Use it for startup; re-running it during a match reloads that map.
// Public release copies must contain defaults only, not your edited passwords.

// SERVER NAME AND CAPACITY
set sv_hostname "Saber Trials Server" // Name shown in Find a Server.
// set sv_location "Ashburn, US" // Optional city and country in Server information.
set sv_maxclients "16"                // Total player/spectator slots; maximum 32.
set g_password ""                    // Empty = anyone can join; otherwise join password.

// GAME TYPE - also choose a suitable map on the LAST line of this file.
// 0 = FFA, 3 = Duel, 6 = Team FFA, 8 = Capture the Flag.
// Suggested maps: FFA/TFFA mp/ffa3; Duel mp/duel3; CTF mp/ctf1.
// The planned replacement Tournament game type and global ranked service
// are not enabled by selecting a number here.
set g_gametype "0"
set timelimit "0"       // Minutes per map; 0 = no time limit.
set fraglimit "0"       // Kill/score limit where applicable; 0 = unlimited.
set capturelimit "8"    // Flag captures to win in CTF.
set g_friendlyFire "0"  // 0 = no team damage; 1 = team damage allowed.

// COMBAT PRESET
set st_combatMode "1"   // 1 = Saber Trials Combat; 0 = Original JKA combat.
// Preferences below apply to Saber Trials Combat. 1 = on, 0 = off.
// Original JKA ignores these preferences without removing their saved values.
set st_activeDefense "1"    // Manual guard, impact-timed parries and counters.
set st_parryRecovery "1"    // Faster ordinary parry recovery.
set st_shields "1"          // Spawn shields and regeneration.
set st_noFallDamage "1"     // Disable falling damage.
set st_forceSpeed "1"       // Give level-three Force Speed at spawn.
set st_fastForceRegen "1"   // Faster Force energy recovery.
set st_masterModeActive "0" // Optional Master combat damage/parry rules.

// BLOCK, PARRY AND FEINT - restart the map after changing latched options.
set g_manualBlocking "1"    // 0 = legacy automatic; 1 = automatic + manual; 2 = manual only.
set st_attackParry "1"      // Tap Attack at impact, with or without Block (Trials active defense).
set st_attackParryWindow "150" // Timing window in ms; clamped to 60-200.
set g_directionalFeints "1" // Single saber: Blue, Yellow, Red, Green and Orange ordinary wind-ups.
// Feint also works crouched/airborne. Purple's full animation system is deferred.
// Manual-only blocking is enforced even with Original JKA selected.

// FORCE AND WEAPONS - independent of the combat preset.
set st_forceModeActive "0" // 0 = Restricted Force; 1 = Full Force.
set st_weaponsActive "0"   // TFFA/CTF: 0 = Sabers Only; 1 = All Weapons.

// OPTIONAL COMBAT TUNING - defaults below match the shared mod preset.
set st_forceRegenInterval "100" // Force recovery interval in ms; 50-1000.
set st_shieldMax "100"          // Maximum regenerating shields.
set st_shieldRegenDelay "5000"  // Milliseconds without damage before recharge.
set st_shieldRegenAmount "2"    // Shields restored per recharge tick.
set st_parryWindow "350"        // Perfect-parry opening window, milliseconds.
set st_parryCooldown "750"      // Parry cooldown, milliseconds.
set st_counterWindow "550"      // Counter opportunity, milliseconds.
set st_masterSaberDamage "50"   // Fixed Master-mode unblocked contact damage.
set st_masterParryStagger "700" // Master-mode perfect-parry stagger, milliseconds.
set st_dismemberChance "100"    // 0-100 percent for qualifying saber killing blows.

// DUEL SERIES AND CURRENT TOURNAMENT BRACKET
set st_duelBestOf "3"            // Odd number 1-9; 1 = stock one-round rotation.
set st_tournamentBestOf "3"      // Best-of series for regular bracket matchups.
set st_tournamentFinalBestOf "5" // Best-of series for the final.
set st_tournamentArenas "mp/duel1 mp/duel2 mp/duel3 mp/duel4"
set st_tournamentAutoStart "300" // Seconds after registration opens; 30-3600.
// Bracket auto-start also requires at least four registered players.
// These settings configure the existing bracket; they do not start an event.

// BOTS
set bot_minplayers "0" // 0 = no automatic bot population; otherwise minimum count.
set st_botSkill "4"    // Skill 1 = easiest through 5 = hardest for role bots.
// Optional role bot after startup: st_addbot duelist
// Other roles/game-type restrictions: docs/BOT_ROLES.md.

// PLAYER VOTES
set g_allowVote "16383" // All currently supported menu votes; 0 disables voting.
set st_voteCooldown "60" // Seconds between vote calls; 0-3600.
set st_voteMaxCalls "3"  // Maximum vote calls per player per map.

// CONNECTION AND MONITORING DEFAULTS
set sv_floodProtect "1" // Limit excessive client command traffic.
set sv_allowDownload "0" // 0 = no in-game UDP downloads; 1 = permit them.
set sv_pure "0"          // Current loose-file mod setup; 1 requires matching PK3s.
set st_anticheatMode "1" // 1 = observations only; 0 = off. No automatic penalties.

// OPTIONAL REMOTE OPERATOR PASSWORD
// Only enable this if you want full remote-console control of your server.
// Choose your own strong password. Keep your edited file private.
// set rconPassword "REPLACE_WITH_YOUR_OWN_PASSWORD"
// Staff accounts work without sharing a remote-console password.

// STAFF ACCOUNTS
// Use staff-setup.cfg manually for enrollment; appointments are saved separately.
// Do NOT exec staff-setup.cfg here: startup must not re-grant removed accounts.
// st_staffGuids is legacy kick-vote protection, not staff authentication.

// START MAP - keep this command LAST, after all settings.
map mp/ffa3
