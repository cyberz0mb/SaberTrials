// SABER TRIALS TOURNAMENT - DEVELOPMENT TEMPLATE
// Requires the staged Tournament build AND the future authenticated account adapter.
// Login is not connected yet. This is not ready for a public event.
// This template does not load or restart a map.

// Leave off in the accepted installed version.
set st_tournamentMode "0"

// Once integration is ready, choose ONE format at server startup:
// Individual: set st_tournamentMode "1" ; set g_gametype "3"
// 2v2 teams:  set st_tournamentMode "2" ; set g_gametype "6"
// 3v3 teams:  set st_tournamentMode "3" ; set g_gametype "6"
// 4v4 teams:  set st_tournamentMode "4" ; set g_gametype "6"
// 5v5 teams:  set st_tournamentMode "5" ; set g_gametype "6"

// The controller owns tournament scores and limits:
// teams 20/30/40/50 kills, ten minutes of play, tie continues to next lead;
// individuals all ten rounds, an extra deciding round at 5-5.
// Full, equal ready lineups are mandatory.
// Reconnect allowance is five minutes individual / ten minutes per team.
// Normal fraglimit/timelimit do not override these rules during an event.
// Standard game type rules resume after the operator closes the event.

// Waiting teams may disconnect; the engine still supports max 32 connections.
// Select server capacity and a suitable map in your normal server.cfg.
// Do not put Discord tokens or application secrets in a downloadable CFG.
