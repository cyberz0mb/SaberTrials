// Saber Trials shared server defaults
// Restricted Force is the module default. The active mode is archived so a
// voted/admin-selected mode survives map changes and server restarts.

// TFFA and CTF default to Sabers Only. Use st_weapons on/off to queue the
// persistent weapon mode for the next round; the gameplay module manages it.

// All supported menu votes: limits, maps, warmup, Force Mode, Game Type,
// Tournament, Kick, Add Bot, and TFFA team locking. Custom masks are supported.
seta g_allowVote "16383"
seta st_voteCooldown "60"
seta st_voteMaxCalls "3"

// Saber Trials role-bot defaults. Bot behavior is server-side, so every
// connected client sees the same decisions without installing an AI service.
seta st_botSkill "4"
seta st_botDuelCooldown "6000"
seta st_botSentinelReaction "90"
seta st_botTricksterChat "12000"

// Saber Trials Guard begins in monitor-only mode. It records observations in
// security.log and never warns, restricts, kicks, or bans a player.
seta st_anticheatMode "1"
seta st_acLogThreshold "5"
seta st_acCommandLimit "30"
seta st_acAttackLimit "14"
seta st_acScoreDecay "30"

// Combat preset/options persist independently; st_combat and st_combatoption
// queue changes. The module selects fall damage and Force regeneration at restart.
// This interval applies only when Saber Trials fast Force regeneration is enabled.
seta st_forceRegenInterval "100"

// Keep OpenJK's normal saber damage model and scale.
seta d_saberSPStyleDamage "1"
seta g_saberDamageScale "1"

// Percentage chance that a qualifying saber killing blow dismembers.
seta st_dismemberChance "100"

// Duel uses a best-of-three series. Set to 1 to restore stock one-round rotation.
seta st_duelBestOf "3"

// Tournament uses best-of-three matches, a best-of-five final, and rotates to
// the next listed Duel arena after every completed matchup.
seta st_tournamentBestOf "3"
seta st_tournamentFinalBestOf "5"
seta st_tournamentArenas "mp/duel1 mp/duel2 mp/duel3 mp/duel4"
// Open registration auto-starts after five minutes once at least four players join.
seta st_tournamentAutoStart "300"

// Saber Trials active defense timing, in milliseconds.
// Hold Walk to guard; the opening window is a perfect parry.
seta st_parryWindow "350"
seta st_parryCooldown "750"
seta st_counterWindow "550"

// Optional Master Mode tuning. The mode itself persists separately and is
// queued with st_master on/off, so this file does not force it on or off.
seta st_masterSaberDamage "50"
seta st_masterParryStagger "700"

// With Saber Trials shields enabled, players spawn with 100 shields. After five seconds without damage,
// shields recharge slowly at two points per second until they reach 100.
seta st_shieldMax "100"
seta st_shieldRegenDelay "5000"
seta st_shieldRegenAmount "2"

// Add administrator/moderator GUIDs separated by spaces.
// Example: seta st_staffGuids "GUID_ONE GUID_TWO"
seta st_staffGuids ""
